name: Build Android APK

on:
  push:
    branches: [ "main", "apk_inp" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Safely ensure wrapper exists before running chmod
      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyGem-debug-apk-${{ github.run_number }}
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "StudyGem Build #${{ github.run_number }}"
          body: "Automated continuous build from commit ${{ github.sha }}."
          draft: false
          prerelease: false
          files: "**/build/outputs/apk/debug/*.apk"
