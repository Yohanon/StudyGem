name: Build Android APK

on:
  push:
    branches: [ "main", "apk_inp" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Ensure Gradle wrapper exists and is executable
      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Configure Signing Properties
        run: |
          mkdir -p ~/.android
          # Create release signing properties from GitHub secrets
          cat > ./release-signing.properties << 'EOF'
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=upload
          keyPassword=${{ secrets.KEY_PASSWORD }}
          storeFile=${{ secrets.KEYSTORE_PATH }}
          EOF
          # Make properties file available to Gradle
          echo "ANDROID_SIGNING_CONFIG=release-signing.properties" >> $GITHUB_ENV

      - name: Build Release APK
        run: >
          ./gradlew assembleRelease --no-daemon
          -Djava.awt.headless=true
          -Dkotlin.daemon.jvm.options="-Djava.awt.headless=true"
          -Dksp.run.in.process=false

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyGem-release-apk-${{ github.run_number }}
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: warn

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "StudyGem Build #${{ github.run_number }}"
          body: "Automated continuous build from commit ${{ github.sha }}."
          draft: false
          prerelease: false
          files: "**/build/outputs/apk/release/*.apk"