name: Build Android APK

on:
  push:
    branches: [ "main", "apk_inp" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Generate Dummy Debug Keystore
        run: |
          keytool -genkeypair -v -keystore ./debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: >
          ./gradlew assembleDebug --no-daemon
          -Djava.awt.headless=true
          -Dkotlin.daemon.jvm.options="-Djava.awt.headless=true"
          -Dksp.run.in.process=false

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyGem-debug-apk-${{ github.run_number }}
          path: "app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "StudyGem Build #${{ github.run_number }}"
          body: "Automated continuous build from commit ${{ github.sha }}."
          draft: false
          prerelease: false
          files: "app/build/outputs/apk/debug/*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
